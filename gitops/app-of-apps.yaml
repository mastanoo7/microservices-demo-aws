apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/replace-org/microservices-demo-aws.git
    targetRevision: main
    path: gitops/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
