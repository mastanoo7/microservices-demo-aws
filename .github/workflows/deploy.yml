name: Deploy platform

on:
  workflow_call:
    inputs:
      image-tag:
        description: Immutable application image tag
        type: string
        required: false
      build-images:
        description: Build, sign, and push service images
        type: boolean
        default: true
      deploy-application:
        description: Deploy the Kubernetes application after infrastructure
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      image-tag:
        description: Immutable application image tag; defaults to this commit SHA
        type: string
        required: false
      build-images:
        description: Build, sign, and push service images
        type: boolean
        default: true
      deploy-application:
        description: Deploy the Kubernetes application after infrastructure
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.8.5

jobs:
  infrastructure:
    name: Terraform apply
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      aws-region: ${{ steps.metadata.outputs.aws-region }}
      image-tag: ${{ steps.metadata.outputs.image-tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
      TFVARS: ${{ secrets.TFVARS }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-dev-terraform
      - name: Resolve deployment metadata
        id: metadata
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail
          {
            echo "aws-region=${AWS_REGION:-us-east-1}"
            echo "image-tag=${INPUT_IMAGE_TAG:-${GITHUB_SHA}}"
          } >> "$GITHUB_OUTPUT"
      - name: Validate environment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Configure TF_STATE_BUCKET in the GitHub environment}"
          : "${TF_LOCK_TABLE:?Configure TF_LOCK_TABLE in the GitHub environment}"
      - name: Write optional Terraform variables
        if: env.TFVARS != ''
        shell: bash
        run: printf '%s\n' "$TFVARS" > "${RUNNER_TEMP}/environment.tfvars"
      - name: Terraform init
        shell: bash
        run: |
          terraform -chdir=terraform/environments/dev init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=online-boutique/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION:-us-east-1}" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"
      - name: Terraform plan
        shell: bash
        run: |
          args=(-input=false -out=tfplan)
          if [[ -s "${RUNNER_TEMP}/environment.tfvars" ]]; then
            args+=("-var-file=${RUNNER_TEMP}/environment.tfvars")
          fi
          terraform -chdir=terraform/environments/dev plan "${args[@]}"
      - name: Terraform apply
        run: terraform -chdir=terraform/environments/dev apply -input=false -auto-approve tfplan

  build-images:
    name: Build ${{ matrix.service }}
    if: inputs.build-images
    needs: infrastructure
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service: ${{ matrix.service }}
      aws-region: ${{ needs.infrastructure.outputs.aws-region }}
      image-tag: ${{ needs.infrastructure.outputs.image-tag }}
    secrets: inherit

  deploy-application:
    name: Deploy Kubernetes workloads
    if: always() && inputs.deploy-application && needs.infrastructure.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    needs: [infrastructure, build-images]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ needs.infrastructure.outputs.aws-region }}
      IMAGE_TAG: ${{ needs.infrastructure.outputs.image-tag }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
      KUBECONFIG: /tmp/online-boutique-kubeconfig
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-dev-kubernetes
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: azure/setup-helm@v4
      - name: Install Session Manager plugin
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            --output "${RUNNER_TEMP}/session-manager-plugin.deb"
          sudo dpkg -i "${RUNNER_TEMP}/session-manager-plugin.deb"
      - name: Read Terraform outputs
        id: cluster
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/environments/dev init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=online-boutique/dev/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"
          endpoint=$(terraform -chdir=terraform/environments/dev output -raw cluster_api_endpoint)
          parameter=$(terraform -chdir=terraform/environments/dev output -raw kubeconfig_ssm_parameter)
          app_hostname=$(terraform -chdir=terraform/environments/dev output -raw app_hostname)
          route53_zone_id=$(terraform -chdir=terraform/environments/dev output -raw route53_zone_id)
          worker_asg=$(terraform -chdir=terraform/environments/dev output -raw worker_autoscaling_group_name)
          bootstrap_generation=$(terraform -chdir=terraform/environments/dev output -raw bootstrap_generation)
          terraform -chdir=terraform/environments/dev output -json control_plane_instance_ids > "${RUNNER_TEMP}/control-plane-ids.json"
          terraform -chdir=terraform/environments/dev output -json route53_name_servers > "${RUNNER_TEMP}/route53-name-servers.json"
          api_host=${endpoint#https://}
          api_host=${api_host%:6443}
          {
            echo "api-host=$api_host"
            echo "parameter=$parameter"
            echo "app-hostname=$app_hostname"
            echo "route53-zone-id=$route53_zone_id"
            echo "worker-asg=$worker_asg"
            echo "bootstrap-generation=$bootstrap_generation"
          } >> "$GITHUB_OUTPUT"
      - name: Connect and deploy
        shell: bash
        env:
          API_HOST: ${{ steps.cluster.outputs.api-host }}
          KUBECONFIG_PARAMETER: ${{ steps.cluster.outputs.parameter }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_HOST: ${{ steps.cluster.outputs.app-hostname }}
          ROUTE53_ZONE_ID: ${{ steps.cluster.outputs.route53-zone-id }}
          WORKER_ASG: ${{ steps.cluster.outputs.worker-asg }}
          BOOTSTRAP_GENERATION: ${{ steps.cluster.outputs.bootstrap-generation }}
        run: |
          set -euo pipefail

          log() {
            printf '[%s] %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$*"
          }

          bootstrap_status_parameter="${KUBECONFIG_PARAMETER%/admin-kubeconfig}/bootstrap-status-control-plane-0"
          target=$(jq -r '.[0] // empty' "${RUNNER_TEMP}/control-plane-ids.json")
          if [[ -z "$target" ]]; then
            echo "Terraform returned no primary control-plane instance ID." >&2
            exit 1
          fi
          log "Waiting for primary control-plane bootstrap generation $BOOTSTRAP_GENERATION."
          kubeconfig_ready=false
          for attempt in $(seq 1 240); do
            bootstrap_status=$(aws ssm get-parameter \
              --name "$bootstrap_status_parameter" \
              --query Parameter.Value \
              --output text 2>/dev/null || true)
            if [[ "$bootstrap_status" == failed* \
              && "$bootstrap_status" == *"instance=$target"* \
              && "$bootstrap_status" == *"generation=$BOOTSTRAP_GENERATION"* ]]; then
              echo "Primary control-plane bootstrap failed: $bootstrap_status" >&2
              exit 1
            fi
            if aws ssm get-parameter \
              --name "$KUBECONFIG_PARAMETER" \
              --with-decryption \
              --query Parameter.Value \
              --output text > "$KUBECONFIG" 2>/dev/null \
              && [[ "$bootstrap_status" == completed* \
                && "$bootstrap_status" == *"instance=$target"* \
                && "$bootstrap_status" == *"generation=$BOOTSTRAP_GENERATION"* ]]; then
              kubeconfig_ready=true
              log "Primary control-plane bootstrap completed and kubeconfig was retrieved from SSM."
              break
            fi
            if (( attempt % 20 == 0 )); then
              log "Primary bootstrap is incomplete; waited $((attempt * 15 / 60)) minutes. Status: ${bootstrap_status:-not published}"
            fi
            sleep 15
          done
          if [[ "$kubeconfig_ready" != "true" || ! -s "$KUBECONFIG" ]]; then
            echo "Primary control-plane bootstrap did not complete after 60 minutes." >&2
            aws ssm get-parameter \
              --name "$bootstrap_status_parameter" \
              --query Parameter.Value \
              --output text || true
            aws ssm get-parameter \
              --name "$KUBECONFIG_PARAMETER" \
              --with-decryption \
              --query Parameter.ARN \
              --output text || true
            exit 1
          fi
          chmod 600 "$KUBECONFIG"

          log "Waiting for primary control-plane instance $target to become online in SSM."
          target_online=false
          for attempt in $(seq 1 60); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$target" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)
            if [[ "$status" == "Online" ]]; then
              target_online=true
              break
            fi
            if (( attempt % 6 == 0 )); then
              log "Primary control-plane instance is not online in SSM yet; waited $((attempt * 10 / 60)) minutes."
            fi
            sleep 10
          done
          if [[ "$target_online" != "true" ]]; then
            echo "Primary control-plane instance $target did not become online in SSM after 10 minutes." >&2
            aws ssm describe-instance-information \
              --query 'InstanceInformationList[].{InstanceId:InstanceId,PingStatus:PingStatus}' \
              --output table >&2 || true
            exit 1
          fi
          log "Using primary control-plane instance $target for the API tunnel."

          # Forward to the API socket on the primary node. Sending this traffic
          # through the NLB can hairpin back to the same target during bootstrap.
          log "Starting the SSM tunnel to the primary control-plane API socket."
          aws ssm start-session \
            --target "$target" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters '{"host":["127.0.0.1"],"portNumber":["6443"],"localPortNumber":["6443"]}' \
            > "${RUNNER_TEMP}/ssm-tunnel.log" 2>&1 &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT

          tunnel_ready=false
          for _ in $(seq 1 60); do
            if nc -z 127.0.0.1 6443; then
              tunnel_ready=true
              break
            fi
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "SSM port-forwarding session exited before the API tunnel became ready." >&2
              cat "${RUNNER_TEMP}/ssm-tunnel.log" >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$tunnel_ready" != "true" ]]; then
            echo "Timed out waiting for the Kubernetes API SSM tunnel on 127.0.0.1:6443." >&2
            cat "${RUNNER_TEMP}/ssm-tunnel.log" >&2
            exit 1
          fi
          log "SSM tunnel is listening on 127.0.0.1:6443."

          cluster=$(kubectl config view -o jsonpath='{.clusters[0].name}')
          if [[ -z "$cluster" ]]; then
            echo "The kubeconfig from $KUBECONFIG_PARAMETER contains no cluster entry." >&2
            exit 1
          fi
          kubectl config set-cluster "$cluster" \
            --server=https://127.0.0.1:6443 \
            --tls-server-name="$API_HOST"

          log "Waiting for the Kubernetes API readiness endpoint."
          api_ready=false
          readiness_started=$SECONDS
          readiness_deadline=$((SECONDS + 1200))
          next_readiness_log=$((SECONDS + 120))
          while (( SECONDS < readiness_deadline )); do
            if kubectl --request-timeout=5s get --raw=/readyz > /dev/null 2>&1; then
              api_ready=true
              log "Kubernetes API is ready."
              break
            fi
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "SSM port-forwarding session exited while waiting for the Kubernetes API." >&2
              cat "${RUNNER_TEMP}/ssm-tunnel.log" >&2
              exit 1
            fi
            if (( SECONDS >= next_readiness_log )); then
              log "Kubernetes API is not ready yet; waited $(((SECONDS - readiness_started) / 60)) minutes."
              next_readiness_log=$((next_readiness_log + 120))
            fi
            sleep 10
          done
          if [[ "$api_ready" != "true" ]]; then
            echo "Kubernetes API did not become ready through the SSM tunnel after 20 minutes." >&2
            kubectl --request-timeout=10s cluster-info >&2 || true
            kubectl --request-timeout=10s get --raw=/readyz?verbose >&2 || true
            cat "${RUNNER_TEMP}/ssm-tunnel.log" >&2
            exit 1
          fi

          log "Waiting for an initialized Ready application worker node."
          worker_ready=false
          worker_readiness_started=$SECONDS
          worker_readiness_deadline=$((SECONDS + 1200))
          next_worker_log=$((SECONDS + 120))
          while (( SECONDS < worker_readiness_deadline )); do
            ready_workers=$(kubectl get nodes \
              -l workload=application \
              -o json 2>/dev/null \
              | jq -r '.items[]
                | select(any(.status.conditions[]?;
                    .type == "Ready" and .status == "True"))
                | select(
                    [.spec.taints[]?.key]
                    | index("node.cloudprovider.kubernetes.io/uninitialized")
                    | not)
                | .metadata.name' || true)
            if [[ -n "$ready_workers" ]]; then
              worker_ready=true
              ready_worker=${ready_workers%%$'\n'*}
              log "Application worker node is initialized and ready: $ready_worker"
              break
            fi
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "SSM port-forwarding session exited while waiting for an application worker." >&2
              cat "${RUNNER_TEMP}/ssm-tunnel.log" >&2
              exit 1
            fi
            if (( SECONDS >= next_worker_log )); then
              log "No initialized Ready application worker yet; waited $(((SECONDS - worker_readiness_started) / 60)) minutes."
              kubectl get nodes -o wide || true
              worker_instance_ids=$(aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "$WORKER_ASG" \
                --query 'AutoScalingGroups[0].Instances[].InstanceId' \
                --output text 2>/dev/null || true)
              current_generation_workers=0
              stale_generation_workers=0
              for worker_instance_id in $worker_instance_ids; do
                worker_status=$(aws ssm get-parameter \
                  --name "${KUBECONFIG_PARAMETER%/admin-kubeconfig}/bootstrap-status-worker-$worker_instance_id" \
                  --query Parameter.Value \
                  --output text 2>/dev/null || true)
                log "Worker $worker_instance_id bootstrap status: ${worker_status:-not published}"
                if [[ "$worker_status" == *"generation=$BOOTSTRAP_GENERATION"* ]]; then
                  current_generation_workers=$((current_generation_workers + 1))
                elif [[ -n "$worker_status" ]]; then
                  stale_generation_workers=$((stale_generation_workers + 1))
                fi
              done
              if [[ -n "$worker_instance_ids" \
                && "$current_generation_workers" -eq 0 \
                && "$stale_generation_workers" -gt 0 ]]; then
                echo "All worker instances use a stale bootstrap generation; the ASG instance refresh did not replace them." >&2
                exit 1
              fi
              next_worker_log=$((next_worker_log + 120))
            fi
            sleep 10
          done
          if [[ "$worker_ready" != "true" ]]; then
            echo "No application worker became initialized and Ready after 20 minutes." >&2
            kubectl get nodes -o wide >&2 || true
            kubectl get pods -n kube-system -o wide >&2 || true
            kubectl get events -A --sort-by=.lastTimestamp >&2 || true
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$WORKER_ASG" \
              --query 'AutoScalingGroups[0].{Desired:DesiredCapacity,Min:MinSize,Max:MaxSize,Instances:Instances[].{Id:InstanceId,Lifecycle:LifecycleState,Health:HealthStatus,AZ:AvailabilityZone}}' \
              --output json >&2 || true
            aws autoscaling describe-scaling-activities \
              --auto-scaling-group-name "$WORKER_ASG" \
              --max-items 10 \
              --query 'Activities[].{Time:StartTime,Status:StatusCode,Cause:Cause,Description:Description,Message:StatusMessage}' \
              --output table >&2 || true
            worker_instance_ids=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$WORKER_ASG" \
              --query 'AutoScalingGroups[0].Instances[].InstanceId' \
              --output text 2>/dev/null || true)
            for worker_instance_id in $worker_instance_ids; do
              aws ssm get-parameter \
                --name "${KUBECONFIG_PARAMETER%/admin-kubeconfig}/bootstrap-status-worker-$worker_instance_id" \
                --query Parameter.Value \
                --output text >&2 || true
            done
            exit 1
          fi

          if [[ ! "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "APP_HOST must be a DNS hostname. Current value: '$APP_HOST'." >&2
            exit 1
          fi
          sed -i "s/value: .*/value: $APP_HOST/" \
            "k8s/overlays/dev/kustomization.yaml"

          log "Installing or upgrading ingress-nginx."
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          # A timed-out Helm pre-install can leave hook Jobs whose service
          # accounts have already been removed. Clear them before retrying.
          kubectl -n ingress-nginx delete job \
            ingress-nginx-admission-create \
            ingress-nginx-admission-patch \
            --ignore-not-found \
            --wait=true \
            --timeout=2m
          if ! helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --version 4.14.3 \
            --set controller.replicaCount=2 \
            --set controller.service.externalTrafficPolicy=Local \
            --set-string controller.service.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-type=nlb \
            --set-string controller.service.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-scheme=internet-facing \
            --wait \
            --timeout 10m; then
            echo "ingress-nginx installation failed. Collecting Kubernetes diagnostics." >&2
            kubectl -n ingress-nginx get all -o wide >&2 || true
            kubectl -n ingress-nginx describe job ingress-nginx-admission-create >&2 || true
            kubectl -n ingress-nginx describe pods >&2 || true
            kubectl -n ingress-nginx get events --sort-by=.lastTimestamp >&2 || true
            exit 1
          fi

          cat >> "k8s/overlays/dev/kustomization.yaml" <<EOF
          images:
          EOF
          for service in adservice cartservice checkoutservice currencyservice emailservice frontend paymentservice productcatalogservice recommendationservice shippingservice; do
            cat >> "k8s/overlays/dev/kustomization.yaml" <<EOF
            - name: public.ecr.aws/online-boutique/$service
              newName: $ECR_REGISTRY/online-boutique/$service
              newTag: $IMAGE_TAG
          EOF
          done

          log "Applying application manifests with image tag $IMAGE_TAG."
          kubectl apply -k k8s/overlays/dev
          log "Waiting for application deployments to roll out."
          while IFS= read -r deployment; do
            kubectl -n online-boutique rollout status "$deployment" --timeout=15m
          done < <(kubectl -n online-boutique get deployments -o name)
          log "Running the in-cluster frontend smoke test."
          kubectl -n online-boutique run deployment-smoke-test \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            --attach \
            -- curl --fail --silent --show-error http://frontend
          kubectl -n online-boutique get pods -o wide

          log "Waiting for the ingress NLB hostname."
          ingress_address=""
          for attempt in $(seq 1 60); do
            ingress_address=$(kubectl -n ingress-nginx get service ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [[ -n "$ingress_address" ]] && break
            if (( attempt % 6 == 0 )); then
              log "Ingress NLB hostname is pending; waited $((attempt * 10 / 60)) minutes."
            fi
            sleep 10
          done
          if [[ -z "$ingress_address" ]]; then
            echo "Ingress NLB hostname was not assigned after 10 minutes." >&2
            kubectl -n ingress-nginx describe service ingress-nginx-controller >&2
            exit 1
          fi
          log "Ingress NLB hostname is $ingress_address."

          change_batch=$(jq -n \
            --arg name "$APP_HOST" \
            --arg value "$ingress_address" \
            '{
              Comment: "Managed by the online-boutique dev deployment workflow",
              Changes: [{
                Action: "UPSERT",
                ResourceRecordSet: {
                  Name: $name,
                  Type: "CNAME",
                  TTL: 60,
                  ResourceRecords: [{Value: $value}]
                }
              }]
            }')
          change_id=$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$ROUTE53_ZONE_ID" \
            --change-batch "$change_batch" \
            --query ChangeInfo.Id \
            --output text)
          log "Waiting for Route 53 change $change_id."
          aws route53 wait resource-record-sets-changed --id "$change_id"
          log "Route 53 record for $APP_HOST is active."

          name_servers=$(jq -r 'join(", ")' "${RUNNER_TEMP}/route53-name-servers.json")
          {
            echo "## Deployment"
            echo
            echo "- Environment: dev"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Application host: \`$APP_HOST\`"
            echo "- Ingress load balancer: \`$ingress_address\`"
            echo "- Route 53 nameservers: \`$name_servers\`"
          } >> "$GITHUB_STEP_SUMMARY"
