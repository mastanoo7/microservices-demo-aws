apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: online-boutique-slo
  namespace: monitoring
spec:
  groups:
    - name: online-boutique.availability
      rules:
        - alert: FrontendHighErrorRate
          expr: sum(rate(http_requests_total{service="frontend",status=~"5.."}[5m])) / sum(rate(http_requests_total{service="frontend"}[5m])) > 0.02
          for: 10m
          labels: { severity: page }
          annotations:
            summary: Frontend 5xx rate exceeds 2 percent
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="online-boutique"}[15m]) > 0
          for: 15m
          labels: { severity: ticket }
          annotations:
            summary: Online Boutique pod is restarting
