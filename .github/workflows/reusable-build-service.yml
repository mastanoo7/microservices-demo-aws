name: Reusable image build

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      image-tag:
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.service }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: gha-dev-${{ inputs.service }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Resolve image and build context
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.service }}" == "cartservice" ]]; then
            context="./src/cartservice/src"
          else
            context="./src/${{ inputs.service }}"
          fi
          repository="online-boutique/${{ inputs.service }}"
          image="${{ steps.ecr.outputs.registry }}/$repository:${{ inputs.image-tag }}"
          {
            echo "context=$context"
            echo "repository=$repository"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
      - name: Check immutable image tag
        id: existing
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name "${{ steps.metadata.outputs.repository }}" \
            --image-ids imageTag="${{ inputs.image-tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image
        if: steps.existing.outputs.exists != 'true'
        run: docker build --tag "${{ steps.metadata.outputs.image }}" "${{ steps.metadata.outputs.context }}"
      - name: Push image
        if: steps.existing.outputs.exists != 'true'
        run: docker push "${{ steps.metadata.outputs.image }}"
      - name: Install Cosign
        if: steps.existing.outputs.exists != 'true'
        uses: sigstore/cosign-installer@v3
      - name: Sign immutable digest
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images \
            --repository-name "${{ steps.metadata.outputs.repository }}" \
            --image-ids imageTag="${{ inputs.image-tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          cosign sign --yes "${{ steps.ecr.outputs.registry }}/${{ steps.metadata.outputs.repository }}@$digest"
