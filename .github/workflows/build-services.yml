name: Build and publish services

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Immutable image tag; defaults to the selected commit SHA
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-services.yml"
      - ".github/workflows/reusable-build-service.yml"

permissions:
  contents: read

concurrency:
  group: images-dev-${{ github.sha }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      aws-region: ${{ steps.values.outputs.aws-region }}
      image-tag: ${{ steps.values.outputs.image-tag }}
    steps:
      - id: values
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          {
            echo "aws-region=${DEFAULT_REGION:-us-east-1}"
            echo "image-tag=${INPUT_IMAGE_TAG:-${GITHUB_SHA}}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service: ${{ matrix.service }}
      aws-region: ${{ needs.metadata.outputs.aws-region }}
      image-tag: ${{ needs.metadata.outputs.image-tag }}
    secrets: inherit
