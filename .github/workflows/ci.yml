name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.8.5

jobs:
  workflows:
    name: GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  yaml:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
      - name: Parse YAML files
        shell: python
        run: |
          from pathlib import Path
          import yaml

          excluded = ("docs/upstream-gke-reference/",)
          for path in sorted(Path(".").rglob("*")):
              name = path.as_posix()
              if path.suffix not in {".yaml", ".yml"}:
                  continue
              if any(name.startswith(prefix) for prefix in excluded):
                  continue
              if name.startswith("helm/") and "/templates/" in name:
                  continue
              with path.open(encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))
              print(name)

  terraform:
    name: Terraform (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, stage, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Check formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize without remote state
        run: terraform -chdir=terraform/environments/${{ matrix.environment }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=terraform/environments/${{ matrix.environment }} validate

  kubernetes:
    name: Kubernetes (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, stage, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize overlay
        run: kubectl kustomize k8s/overlays/${{ matrix.environment }} > /tmp/rendered.yaml
      - name: Validate rendered YAML
        run: kubectl apply --dry-run=client --validate=false -f /tmp/rendered.yaml

  helm:
    name: Helm charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint charts
        shell: bash
        run: |
          set -euo pipefail
          for chart in helm/*; do
            helm lint "$chart"
            helm template test "$chart" > /dev/null
          done

  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
    steps:
      - uses: actions/checkout@v4
      - name: Resolve build context
        id: context
        shell: bash
        run: |
          if [[ "${{ matrix.service }}" == "cartservice" ]]; then
            echo "path=./src/cartservice/src" >> "$GITHUB_OUTPUT"
          else
            echo "path=./src/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: docker build --tag "local/${{ matrix.service }}:${{ github.sha }}" "${{ steps.context.outputs.path }}"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
