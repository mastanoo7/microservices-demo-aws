  template:
    metadata: { labels: { app: cartservice } }
    spec:
      serviceAccountName: online-boutique
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: cartservice
          image: public.ecr.aws/online-boutique/cartservice:latest
          ports: [{ containerPort: 7070 }]
          env:
            - { name: REDIS_ADDR, value: "redis-cart:6379" }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          readinessProbe: { tcpSocket: { port: 7070 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 7070 }, initialDelaySeconds: 30, periodSeconds: 20 }
---
