name: Destroy platform

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type destroy-dev
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.8.5

jobs:
  destroy:
    name: Destroy dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
      TFVARS: ${{ secrets.TFVARS }}
    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          if [[ "${{ inputs.confirmation }}" != "destroy-dev" ]]; then
            echo "Confirmation must be destroy-dev" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-dev-destroy
      - name: Validate environment configuration
        shell: bash
        run: |
          : "${TF_STATE_BUCKET:?Configure TF_STATE_BUCKET in the GitHub environment}"
          : "${TF_LOCK_TABLE:?Configure TF_LOCK_TABLE in the GitHub environment}"
      - name: Write optional Terraform variables
        if: env.TFVARS != ''
        run: printf '%s\n' "$TFVARS" > "${RUNNER_TEMP}/environment.tfvars"
      - name: Terraform init
        shell: bash
        run: |
          terraform -chdir=terraform/environments/dev init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=online-boutique/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION:-us-east-1}" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"
      - name: Terraform destroy
        shell: bash
        run: |
          args=(-input=false -auto-approve)
          if [[ -s "${RUNNER_TEMP}/environment.tfvars" ]]; then
            args+=("-var-file=${RUNNER_TEMP}/environment.tfvars")
          fi
          terraform -chdir=terraform/environments/dev destroy "${args[@]}"
