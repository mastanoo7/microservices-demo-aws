name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.8.5

jobs:
  workflows:
    name: GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  yaml:
    name: YAML syntax
    needs: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
      - name: Parse YAML files
        shell: python
        run: |
          from pathlib import Path
          import yaml

          excluded = ("docs/upstream-gke-reference/",)
          for path in sorted(Path(".").rglob("*")):
              name = path.as_posix()
              if path.suffix not in {".yaml", ".yml"}:
                  continue
              if any(name.startswith(prefix) for prefix in excluded):
                  continue
              if name.startswith("helm/") and "/templates/" in name:
                  continue
              with path.open(encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))
              print(name)

  terraform:
    name: Terraform plan (dev)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: yaml
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
      TFVARS: ${{ secrets.TFVARS }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-dev-plan
      - name: Check formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate environment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Configure TF_STATE_BUCKET in the GitHub environment}"
          : "${TF_LOCK_TABLE:?Configure TF_LOCK_TABLE in the GitHub environment}"
      - name: Write optional Terraform variables
        if: env.TFVARS != ''
        shell: bash
        run: printf '%s\n' "$TFVARS" > "${RUNNER_TEMP}/environment.tfvars"
      - name: Initialize remote state
        shell: bash
        run: |
          terraform -chdir=terraform/environments/dev init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=online-boutique/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION:-us-east-1}" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"
      - name: Validate
        run: terraform -chdir=terraform/environments/dev validate
      - name: Plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          args=(-input=false -lock-timeout=5m -detailed-exitcode)
          if [[ -s "${RUNNER_TEMP}/environment.tfvars" ]]; then
            args+=("-var-file=${RUNNER_TEMP}/environment.tfvars")
          fi

          set +e
          terraform -chdir=terraform/environments/dev plan "${args[@]}"
          exit_code=$?
          set -e

          case "$exit_code" in
            0)
              result="No infrastructure changes."
              ;;
            2)
              result="Infrastructure changes are proposed."
              ;;
            *)
              echo "Terraform plan failed with exit code $exit_code" >&2
              exit "$exit_code"
              ;;
          esac

          {
            echo "## Terraform plan: dev"
            echo
            echo "$result"
          } >> "$GITHUB_STEP_SUMMARY"

  kubernetes:
    name: Kubernetes (dev)
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize overlay
        run: kubectl kustomize k8s/overlays/dev > /tmp/rendered.yaml
      - name: Validate rendered YAML
        run: kubectl apply --dry-run=client --validate=false -f /tmp/rendered.yaml

  helm:
    name: Helm charts
    needs: kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint charts
        shell: bash
        run: |
          set -euo pipefail
          for chart in helm/*; do
            helm lint "$chart"
            helm template test "$chart" > /dev/null
          done

  images:
    name: Image (${{ matrix.service }})
    needs: helm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
    steps:
      - uses: actions/checkout@v4
      - name: Resolve build context
        id: context
        shell: bash
        run: |
          if [[ "${{ matrix.service }}" == "cartservice" ]]; then
            echo "path=./src/cartservice/src" >> "$GITHUB_OUTPUT"
          else
            echo "path=./src/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: docker build --tag "local/${{ matrix.service }}:${{ github.sha }}" "${{ steps.context.outputs.path }}"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy-dev:
    name: Apply and deploy dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      image-tag: ${{ github.sha }}
      build-images: true
      deploy-application: true
    secrets: inherit
