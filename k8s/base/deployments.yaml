apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      serviceAccountName: online-boutique
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: frontend } }
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: public.ecr.aws/online-boutique/frontend:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: PRODUCT_CATALOG_SERVICE_ADDR, value: "productcatalogservice:3550" }
            - { name: CURRENCY_SERVICE_ADDR, value: "currencyservice:7000" }
            - { name: CART_SERVICE_ADDR, value: "cartservice:7070" }
            - { name: RECOMMENDATION_SERVICE_ADDR, value: "recommendationservice:8080" }
            - { name: CHECKOUT_SERVICE_ADDR, value: "checkoutservice:5050" }
            - { name: AD_SERVICE_ADDR, value: "adservice:9555" }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          readinessProbe: { httpGet: { path: /_healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /_healthz, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 20 }
          startupProbe: { httpGet: { path: /_healthz, port: 8080 }, failureThreshold: 30, periodSeconds: 5 }
---
